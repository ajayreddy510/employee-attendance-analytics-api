services:
  - type: web
    name: employee-attendance-analytics-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_DB
        value: attendance_db
      - key: MONGO_URI
        sync: false
